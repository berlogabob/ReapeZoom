name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # reapack-index reads full history

      - name: Script self-check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          for f in Scripts/*.lua; do
            echo "== $f"
            out=$(lua5.4 "$f")
            [ "$out" = "ok" ] || { echo "expected 'ok', got '$out'"; exit 1; }
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Validates the @-headers. Does not write index.xml -- that is generated
      # locally (see README) so there is only ever one source of truth.
      - name: Validate ReaPack metadata
        run: |
          gem install reapack-index
          reapack-index --check
