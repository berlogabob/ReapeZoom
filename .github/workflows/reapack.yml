name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # reapack-index reads full history

      - name: Script self-check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          # Every script must parse. The action scripts are REAPER glue and
          # cannot run headless; the testable logic all lives in Scripts/lib.
          for f in Scripts/*.lua Scripts/lib/*.lua; do
            luac5.4 -p "$f" || { echo "syntax error in $f"; exit 1; }
          done
          for f in Scripts/lib/*.lua; do
            echo "== $f"
            out=$(lua5.4 "$f")
            [ "$out" = "ok" ] || { echo "expected 'ok', got '$out'"; exit 1; }
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Validates the @-headers. Does not write index.xml -- that is generated
      # locally (see README) so there is only ever one source of truth.
      - name: Validate ReaPack metadata
        run: |
          sudo apt-get install -y -qq pandoc  # reapack-index renders @about to RTF via pandoc
          gem install reapack-index
          reapack-index --check
